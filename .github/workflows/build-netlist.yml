name: Build NetlistEditor (Windows, Mac, Linux)

on:
  push:
    branches: [ "main", "crimson_starfish" ] # Triggers the build when you push
  workflow_dispatch:     # Allows you to trigger it manually from the website

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Install Qt 5
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        setup-python: 'false'

    # ─────────────────────────────────────────────────────────────
    # LINUX BUILD
    # ─────────────────────────────────────────────────────────────
    - name: Install Linux Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-20.04'
      run: |
        sudo apt update
        sudo apt install -y build-essential cmake pkg-config libqwt-qt5-dev libqt5svg5-dev

    - name: Compile Linux
      if: matrix.os == 'ubuntu-20.04'
      run: |
        cd NetlistEditor
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j
        
        # Download linuxdeployqt to bundle the libraries
        wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
        chmod a+x linuxdeployqt-continuous-x86_64.AppImage
        ./linuxdeployqt-continuous-x86_64.AppImage build/CRIMSONBCT -appimage

    # ─────────────────────────────────────────────────────────────
    # MAC BUILD
    # ─────────────────────────────────────────────────────────────
    - name: Compile Mac
      if: matrix.os == 'macos-latest'
      run: |
        brew install qwt
        cd NetlistEditor
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j
        
        macdeployqt build/CRIMSONBCT.app

    # ─────────────────────────────────────────────────────────────
    # WINDOWS BUILD
    # ─────────────────────────────────────────────────────────────
    - name: Compile Windows
      if: matrix.os == 'windows-latest'
      run: |
        cd NetlistEditor
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j
        
        cd build
        windeployqt CRIMSONBCT.exe

    # ─────────────────────────────────────────────────────────────
    # UPLOAD THE FINISHED BINARY TO GITHUB
    # ─────────────────────────────────────────────────────────────
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: CRIMSONBCT-${{ matrix.name }}
        path: |
          NetlistEditor/build/CRIMSONBCT*
